<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KantinKu - Pemesanan Makanan</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#222}
header{background:#2196f3;color:white;padding:22px 18px;text-align:center}
header h1{margin:0 0 6px;font-size:28px}
header p{margin:0;opacity:.9}
.container{max-width:900px;margin:auto;padding:18px}
.card{background:white;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
h2{margin-top:0}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.item{border:1px solid #e3e8ef;border-radius:14px;padding:14px}
.item .emoji{font-size:42px;text-align:center}
.item h3{margin:8px 0 4px}
.price{font-weight:bold;color:#2196f3;margin-bottom:10px}
button{border:0;border-radius:10px;padding:10px 14px;background:#2196f3;color:white;font-weight:bold;cursor:pointer}
button:hover{opacity:.9}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:34px;padding:8px 0}
.cart-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:12px 0}
.cart-row:last-child{border-bottom:0}
.total{font-size:20px;font-weight:bold;text-align:right;margin-top:14px}
input,select{width:100%;padding:11px;border:1px solid #ccd5df;border-radius:10px;margin-top:6px}
label{display:block;margin:12px 0;font-weight:bold}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.secondary{background:#607d8b}
.danger{background:#e53935}
#empty{color:#777;text-align:center;padding:10px}
#receipt{display:none}
.success{background:#e8f5e9;border-left:5px solid #43a047;padding:14px;border-radius:8px}
</style>
</head>
<body>
<header>
  <h1>🍱 KantinKu</h1>
  <p>Aplikasi Pemesanan Menu Makanan Kantin</p>
</header>

<div class="container">
  <section class="card">
    <h2>📋 Daftar Menu</h2>
    <div id="menu" class="menu"></div>
  </section>

  <section class="card">
    <h2>🛒 Pesanan Saya</h2>
    <div id="cart"></div>
    <div class="total">Total: <span id="total">Rp0</span></div>
  </section>

  <section class="card">
    <h2>💳 Data Pemesanan</h2>
    <label>Nama
      <input id="name" type="text" placeholder="Masukkan nama">
    </label>
    <label>Kelas
      <input id="class" type="text" placeholder="Contoh: X ATPH 1">
    </label>
    <label>Metode Pembayaran
      <select id="payment">
        <option>Cash</option>
        <option>QRIS</option>
        <option>Transfer</option>
      </select>
    </label>
    <div class="actions">
      <button onclick="order()">Pesan Sekarang</button>
      <button class="danger" onclick="clearCart()">Kosongkan Pesanan</button>
    </div>
  </section>

  <section id="receipt" class="card"></section>
</div>

<script>
const menu = [
  {id:1,name:"Nasi Goreng",price:12000,emoji:"🍳"},
  {id:2,name:"Mie Goreng",price:10000,emoji:"🍜"},
  {id:3,name:"Nasi Ayam",price:15000,emoji:"🍗"},
  {id:4,name:"Bakso",price:12000,emoji:"🍲"},
  {id:5,name:"Es Teh",price:5000,emoji:"🧋"},
  {id:6,name:"Es Jeruk",price:6000,emoji:"🍊"}
];

let cart = {};

function rupiah(n){
  return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n);
}

function renderMenu(){
  document.getElementById("menu").innerHTML = menu.map(x => `
    <div class="item">
      <div class="emoji">${x.emoji}</div>
      <h3>${x.name}</h3>
      <div class="price">${rupiah(x.price)}</div>
      <button onclick="add(${x.id})">+ Tambah</button>
    </div>
  `).join("");
}

function add(id){
  cart[id]=(cart[id]||0)+1;
  renderCart();
}

function change(id,delta){
  cart[id]=(cart[id]||0)+delta;
  if(cart[id]<=0) delete cart[id];
  renderCart();
}

function renderCart(){
  const el=document.getElementById("cart");
  const ids=Object.keys(cart);
  if(!ids.length){
    el.innerHTML='<div id="empty">Belum ada makanan yang dipilih.</div>';
    document.getElementById("total").textContent=rupiah(0);
    return;
  }
  let total=0;
  el.innerHTML=ids.map(id=>{
    const x=menu.find(m=>m.id==id);
    const sub=x.price*cart[id]; total+=sub;
    return `<div class="cart-row">
      <div><b>${x.emoji} ${x.name}</b><br><small>${rupiah(x.price)} × ${cart[id]} = ${rupiah(sub)}</small></div>
      <div class="qty">
        <button class="secondary" onclick="change(${id},-1)">−</button>
        <b>${cart[id]}</b>
        <button onclick="change(${id},1)">+</button>
      </div>
    </div>`;
  }).join("");
  document.getElementById("total").textContent=rupiah(total);
}

function clearCart(){
  cart={}; renderCart();
  document.getElementById("receipt").style.display="none";
}

function order(){
  const name=document.getElementById("name").value.trim();
  const kelas=document.getElementById("class").value.trim();
  const payment=document.getElementById("payment").value;
  const ids=Object.keys(cart);
  if(!ids.length){alert("Pilih makanan terlebih dahulu.");return;}
  if(!name||!kelas){alert("Isi nama dan kelas terlebih dahulu.");return;}

  let total=0;
  const list=ids.map(id=>{
    const x=menu.find(m=>m.id==id), sub=x.price*cart[id]; total+=sub;
    return `<li>${x.name} × ${cart[id]} — ${rupiah(sub)}</li>`;
  }).join("");

  const r=document.getElementById("receipt");
  r.style.display="block";
  r.innerHTML=`<div class="success">
    <h2>✅ Pesanan Berhasil</h2>
    <p><b>Nama:</b> ${name}<br><b>Kelas:</b> ${kelas}<br><b>Pembayaran:</b> ${payment}</p>
    <b>Detail Pesanan:</b><ul>${list}</ul>
    <h3>Total Pembayaran: ${rupiah(total)}</h3>
    <p>Silakan lakukan pembayaran dan ambil pesanan di kantin.</p>
  </div>`;
  r.scrollIntoView({behavior:"smooth"});
}

renderMenu();
renderCart();
</script>
</body>
</html>
